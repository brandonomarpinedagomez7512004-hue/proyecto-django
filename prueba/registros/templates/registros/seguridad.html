{% extends "inicio/encabezado.html" %}

{% block titulo %}
    SEGURIDAD
{% endblock %}

{% block encabezado %}
    <div class="page-header">
        <div class="page-title">
            <h3>
                Prueba de seguridad XSS
                <small>Escribe algo en el campo y busca</small>
            </h3>
        </div>
    </div>

    <form class="form-horizontal" method="GET">
        <div class="form-group">
            <label class="col-sm-2 control-label text-right">Nombre:</label>
            <div class="col-sm-10">
                <input type="text" name="nombre" class="form-control" />
            </div>
        </div>

        <div class="form-group">
            <div class="col-sm-10 col-sm-offset-2">
                <button type="submit" class="btn btn-primary">Buscar</button>
            </div>
        </div>
    </form>

    <h2>Resultado (protegido por Django): {{ nombre }}</h2>
    <h2>Resultado (usando |safe, SIN protección): {{ nombre|safe }}</h2>
{% endblock %}
